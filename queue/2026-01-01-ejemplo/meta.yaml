# Post de ejemplo: cópialo como plantilla. Mientras esté en "draft" NO se publica.
#
# Estados:
#   draft      -> en preparación (no se publica)
#   approved   -> listo: se publicará cuando llegue scheduled_date
#   published  -> publicado (lo escribe el script)
#   failed     -> falló (lo escribe el script; revisa "error" y vuelve a poner approved)
status: draft
scheduled_date: 2026-01-01   # AAAA-MM-DD; se publica en la primera ejecución diaria a partir de esta fecha
caption: |
  Título o gancho del post.

  Texto del caption. Admite saltos de línea y emojis.
hashtags:
  - marketing
  - excel
# Imágenes: slide-01.jpg, slide-02.jpg... (1 = post simple, 2-10 = carrusel; solo JPG)
