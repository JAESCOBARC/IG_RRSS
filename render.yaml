# Blueprint de Render: New + > Blueprint > este repositorio.
services:
  - type: web
    name: ig-rrss
    runtime: python
    plan: free
    rootDir: app
    buildCommand: pip install -r requirements.txt
    # 1 worker: el estado de "publicando" y el límite de intentos de login viven en memoria
    startCommand: gunicorn server:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
