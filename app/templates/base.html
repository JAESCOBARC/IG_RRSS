<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Aprobaciones{% endblock %} · Trabajo en Excel</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}">Trabajo en Excel<span> · aprobaciones</span></a>
  {% if session.get('auth') %}
  <form method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="link" type="submit">Salir</button>
  </form>
  {% endif %}
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ category }}" role="status">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
