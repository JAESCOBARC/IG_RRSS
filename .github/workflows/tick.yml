name: Programador de publicaciones

# Aviso de RESPALDO a la app. La app decide qué toca publicar según la programación guardada
# en la app (panel → Programación) (un post por hueco y tipo: el más antiguo de la cola de ese
# tipo). El aviso PRIMARIO y fiable es un cron externo (cron-job.org, ver app/README.md §4) que
# llama a /api/cron/tick directamente cada pocos minutos: los avisos programados de GitHub
# Actions pueden retrasarse horas (incidente conocido de GitHub, no solo "unos minutos"), así
# que este workflow ya no es la única vía. Se mantiene porque, si el cron externo no ha
# reclamado el hueco todavía, esperará el resultado de la publicación y avisará por correo si
# falla; si el hueco ya se cubrió, la app responde "slot-used" sin hacer nada (reclamar un hueco
# es atómico, no hay riesgo de publicar dos veces). El minuto de disparo está desplazado de las
# horas en punto y medias (:00/:30) porque son las de mayor congestión en GitHub.
on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "PRUEBA: publicar YA el post aprobado más antiguo, sin esperar al hueco"
        type: boolean
        default: false
      tipo:
        description: "Solo con «forzar»: qué tipo publicar (cualquiera = el más antiguo de todos)"
        type: choice
        options: [cualquiera, carrusel, publicacion, historia]
        default: cualquiera

permissions:
  actions: write   # para reactivar este workflow y que GitHub no lo desactive por inactividad

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Avisar a la app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
          FORZAR: ${{ inputs.forzar }}
          TIPO: ${{ inputs.tipo }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ] || [ -z "${APP_API_KEY}" ]; then
            echo "::warning::Programador sin configurar: faltan los secrets APP_URL y/o APP_API_KEY (ver app/README.md, paso 4)"
            exit 0
          fi
          base="${APP_URL%/}"
          url="${base}/api/cron/tick"
          if [ "${FORZAR:-false}" = "true" ]; then
            url="${url}?force=1"
            if [ -n "${TIPO:-}" ] && [ "${TIPO}" != "cualquiera" ]; then url="${url}&kind=${TIPO}"; fi
          fi

          # el plan gratuito de Render tarda ~1 min en despertar: se reintenta
          resp=$(curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 180 \
                 -X POST -H "Authorization: Bearer ${APP_API_KEY}" "$url")
          echo "$resp"
          ids=$(echo "$resp" | jq -r '.post_ids[]?')
          [ -n "$ids" ] || exit 0

          # hay publicaciones en curso: se espera a cada resultado para que un fallo avise por correo
          fail=0
          for id in $ids; do
            result=""
            for _ in $(seq 1 60); do
              sleep 10
              st=$(curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer ${APP_API_KEY}" "${base}/api/posts/${id}")
              status=$(echo "$st" | jq -r '.status')
              kind=$(echo "$st" | jq -r '.kind')
              echo "${kind} ${id}: ${status}"
              case "$status" in
                published) echo "Publicado (${kind}): $(echo "$st" | jq -r '.permalink')"; result=ok; break ;;
                failed) echo "::error::La publicación (${kind}) falló: $(echo "$st" | jq -r '.error')"; result=fail; break ;;
              esac
            done
            if [ "$result" != "ok" ]; then
              [ "$result" = "fail" ] || echo "::error::La publicación ${id} no terminó en 10 minutos"
              fail=1
            fi
          done
          exit $fail

      - name: Mantener activo el programador
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/tick.yml/enable" || true
