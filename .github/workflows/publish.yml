name: Publicar en Instagram

on:
  schedule:
    - cron: "0 9 * * *"   # cada día a las 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo validar los posts pendientes, sin publicar"
        type: boolean
        default: false

permissions:
  contents: write   # para guardar el resultado (published/failed) en meta.yaml

concurrency:
  group: ig-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests pyyaml

      - name: Publicar posts aprobados
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/publish.py --dry-run
          else
            python scripts/publish.py
          fi

      # always(): guarda el resultado aunque un post haya fallado, para no volver a intentarlo
      - name: Guardar resultado en el repositorio
        if: always()
        run: |
          git config user.name "ig-publisher[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add queue
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "chore: resultado de publicación [skip ci]"
            git push
          fi
